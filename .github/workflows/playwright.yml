name: Playwright

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * *' # nightly, 03:00 UTC
  workflow_dispatch:
    inputs:
      grep:
        description: 'Optional --grep filter, e.g. @smoke'
        required: false
        default: ''

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check

  test:
    name: ${{ matrix.project }}
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [api, ui-chromium]
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Install Chromium
        if: matrix.project != 'api'
        run: npx playwright install --with-deps chromium

      - name: Run tests
        env:
          GREP: ${{ inputs.grep }}
        # Passed through env, never interpolated into the script, to avoid shell injection.
        run: npx playwright test --project=${{ matrix.project }} ${GREP:+--grep "$GREP"}

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14
